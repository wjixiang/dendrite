[package]
name = "dendrite-tools"
version = "0.1.0"
edition = "2024"
description = "External (domain-specific) tools for the agentik-core runtime. Built around the KMS service."

[dependencies]
kms = { path = "../kms" }
corpus = { path = "../corpus" }

agentik-core = { path = "../agentik-core" }
agentik-sdk = { git = "ssh://git@github.com/wjixiang/agentik-sdk.git", branch = "main" }

async-trait = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1.23", features = ["v4"] }
