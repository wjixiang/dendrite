[package]
name = "dendrite-tools"
version = "0.1.0"
edition = "2024"
description = "External (domain-specific) tools for the agentik-core runtime. Built around the KMS service."

[dependencies]
kms = { path = "../kms" }

agentik-core = { workspace = true }
agentik-types = { workspace = true }

futures = "0.3"
serde_json = "1"
uuid = { version = "1.23", features = ["v4"] }
