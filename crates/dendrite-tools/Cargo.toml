[package]
name = "dendrite-tools"
version = "0.1.0"
edition = "2024"
description = "External (domain-specific) tools for the agentik-core runtime. Built around the KMS service."

[dependencies]
# KMS service (KMS-specific tool implementations)
kms = { path = "../kms" }

# agentik-core's tools framework: ToolRegistration, SimpleTool, ToolFunction, Toolset, etc.
# MUST use the exact same git URL as `agentik-core` in crates/agent-kms/Cargo.toml,
# otherwise Cargo sees two distinct crate instances and `ToolRegistration` becomes
# a different type in each, breaking the `AgentContext` trait impl in agent-kms.
tools = { git = "https://github.com/wjixiang/agentik-core.git" }
types = { git = "https://github.com/wjixiang/agentik-core.git" }

futures = "0.3"
serde_json = "1"
uuid = { version = "1.23", features = ["v4"] }
