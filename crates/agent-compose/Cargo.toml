[package]
name = "agent-compose"
version = "0.1.0"
edition = "2024"
description = "Knowledge construction expert agent context."

[dependencies]
agentik = { workspace = true }

# Domain-specific tools (KMS). These are external to agentik-core.
dendrite-tools = { path = "../dendrite-tools" }

# KMS service itself
kms = { path = "../kms" }
corpus = { path = "../corpus" }

async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1.12", features = ["v4"] }
