[package]
name = "agentik-types"
version = "0.1.0"
edition.workspace = true
authors = ["Wjixiang"]
description = "Shared type definitions for the Anthropic API (agentik ecosystem)."
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.13", features = [
  "json",
  "query",
  "stream",
  "multipart",
], optional = true }

[features]
default = ["http"]
http = ["dep:reqwest"]

[dev-dependencies]
serde_json = { workspace = true }
