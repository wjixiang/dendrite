[package]
name = "agent_panel_tui"
version = "0.1.0"
edition = "2024"
description = "Reusable TUI panel that renders sub-agents managed by agentik's ProcessManager."
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
# ProcessEvent / ProcessExitStatus come from agentik-core's process
# module. We depend on the path crate (not a git dep) so the workspace
# only has one copy of agentik-core.
agentik-core = { path = "../agentik-core" }

# AgentEvent lives in agentik-sdk::types. It is also re-exported by
# agentik-core, but only as `pub use agentik_sdk::{model, provider}`
# — not `types`. We pull the git dep directly to get the type
# unambiguously. (The same git URL is already used by every other
# crate in the workspace.)
agentik-sdk = { git = "https://github.com/wjixiang/agentik-sdk.git", branch = "main" }

# Pure rendering deps.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
