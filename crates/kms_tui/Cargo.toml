[package]
name = "kms_tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kms-tui"
path = "src/main.rs"

[dependencies]
agent = { path = "../agent" }
llm_api = { path = "../llm_api" }
types = { path = "../types" }
serde_json = "1"
kms = { path = "../kms" }
ratatui = "0.29"
crossterm = "0.28"
dotenvy = "0.15.7"
tokio = { version = "1.52.3", features = ["sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = "1"
