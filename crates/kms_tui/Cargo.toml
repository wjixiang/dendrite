[package]
name = "kms_tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kms-tui"
path = "src/main.rs"

[dependencies]
agentik-core = { workspace = true }
agent-compose = { path = "../agent-compose" }
agent-knowledge = { path = "../agent-knowledge" }
agentik-sdk = { workspace = true }
agentik-types = { workspace = true, features = ["http"] }
kms = { path = "../kms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
dotenvy = "0.15.7"
tokio = { version = "1.52.3", features = ["sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = "1"
