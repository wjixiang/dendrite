[package]
name = "kms_tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kms-tui"
path = "src/main.rs"

[dependencies]
agentik = { path = "../agentik" }
agent-compose = { path = "../agent-compose" }
agent-knowledge = { path = "../agent-knowledge" }
dendrite-tools = { path = "../dendrite-tools" }
kms = { path = "../kms" }
corpus = { path = "../corpus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
dotenvy = "0.15.7"
tokio = { version = "1.52.3", features = ["sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = "1"
