[package]
name = "kms_tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kms-tui"
path = "src/main.rs"

[dependencies]
# agentik-core lives in a separate repository. Locally we point to it via path;
# in production, this would be a git dep: agentik-core = { git = "...", tag = "vX.Y.Z" }
agentik-core = { path = "../../../agentik-core/crates/agentik-core" }
agent-kms = { path = "../agent-kms" }
llm_api = { path = "../../../agentik-core/crates/llm_api" }
types = { path = "../../../agentik-core/crates/types", features = ["http"] }
kms = { path = "../kms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
dotenvy = "0.15.7"
tokio = { version = "1.52.3", features = ["sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = "1"
