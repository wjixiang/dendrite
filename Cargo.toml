[workspace]
resolver = "3"
members = [
  "crates/corpus",
  "crates/dendrite-tools",
  "crates/agent-compose",
  "crates/agent-knowledge",
  "crates/kms",
  "crates/kms_tui",
]

[workspace.dependencies]
# Single umbrella dependency for the agentik ecosystem. The upstream
# monorepo at github.com/wjixiang/agentik publishes one crate `agentik`
# that wholesale re-exports agentik-core, agentik-sdk, and agentik-types
# under `agentik::core`, `agentik::sdk`, `agentik::types`. All dendrite
# code goes through this single dependency so Cargo can never split the
# ecosystem across multiple sources.
agentik = { git = "https://github.com/wjixiang/agentik.git" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.13.4", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
