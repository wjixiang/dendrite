[workspace]
resolver = "3"
members = [
  "crates/dendrite-tools",
  "crates/agent-kms",
  "crates/kms",
  "crates/kms_tui",
]

[workspace.dependencies]
# agentik-core and its sub-crates are all published from the same upstream repo.
# They MUST all use the same git URL — Cargo unifies by (name, version, source),
# so even one straggler on a different URL causes that crate to be compiled twice
# and breaks type identity for the AgentContext trait, ModelPool, ContentBlock, etc.
agentik-core = { git = "https://github.com/wjixiang/agentik-core.git" }
llm_api = { git = "https://github.com/wjixiang/agentik-core.git" }
tools = { git = "https://github.com/wjixiang/agentik-core.git" }
types = { git = "https://github.com/wjixiang/agentik-core.git" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.13.4", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
