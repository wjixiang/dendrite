[workspace]
resolver = "3"
members = [
  "crates/dendrite-tools",
  "crates/agent-kms",
  "crates/kms",
  "crates/kms_tui",
]

[workspace.dependencies]
# Each agentik sub-project lives in its own git repo (submodule layout).
# They MUST all use their correct git URL — Cargo unifies by (name, version, source),
# so mixing URLs causes duplicate compilations and breaks type identity for
# AgentContext, ModelPool, ContentBlock, ToolRegistration, etc.
agentik-core = { git = "https://github.com/wjixiang/agentik-core.git" }
agentik-sdk = { git = "https://github.com/wjixiang/agentik-sdk.git" }
agentik-types = { git = "https://github.com/wjixiang/agentik-types.git" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.13.4", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
