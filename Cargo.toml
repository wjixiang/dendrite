[workspace]
resolver = "3"
members = [
  "crates/dendrite-tools",
  "crates/agent-kms",
  "crates/kms",
  "crates/kms_tui",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.13.4", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
